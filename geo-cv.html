<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Theo Gatsios — Geospatial CV</title>

<!-- MapLibre GL JS 4.7.1 (UMD build → global `maplibregl`; 5.x is ESM-only) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" crossorigin="anonymous" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0a0f16;
    --panel:#0e151f;
    --panel-2:#121b27;
    --line:#1f2c3c;
    --text:#cdd6e3;
    --text-dim:#7d8ca1;
    --gold:#e8b15e;
    --gold-soft:#caa35a;
    --cyan:#5fd0d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);
    font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;}
  a{color:var(--cyan);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
  a:hover{border-color:var(--cyan)}

  /* ---------- LAYOUT ---------- */
  .stage{display:grid;grid-template-columns:42% 58%;min-height:100vh}
  .narrative{position:relative;z-index:2;padding:0 clamp(20px,3.5vw,64px)}
  .mapwrap{position:sticky;top:0;height:100vh;align-self:start;z-index:1}
  #map{width:100%;height:100%;background:#070b10}

  /* ---------- HUD + RAIL ---------- */
  .hud{position:absolute;left:18px;bottom:26px;z-index:5;
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-dim);
    background:rgba(10,15,22,.62);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:6px;padding:9px 12px;letter-spacing:.02em;
    line-height:1.6;pointer-events:none}
  .hud b{color:var(--gold);font-weight:500}
  .hud .crs{color:#566374}
  .rail{position:fixed;top:0;left:0;height:3px;width:0;z-index:1000;
    background:linear-gradient(90deg,var(--gold),var(--cyan));transition:width .25s ease}

  /* ---------- MARKERS ---------- */
  .pin-hit{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:opacity .4s ease}
  .pin{position:relative;width:14px;height:14px}
  .pin i{position:absolute;inset:0;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 1.5px rgba(16,24,36,.85),0 1px 5px rgba(0,0,0,.4);
    transition:transform .35s ease,background .4s ease,box-shadow .4s ease}
  .pin-hit:hover .pin i{transform:scale(1.2)}
  .pin .ring{position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--gold);opacity:0}

  /* current chapter */
  .pin-hit.on .pin i{transform:scale(1.45);background:#f2bd62;
    box-shadow:0 0 0 1.5px rgba(16, 24, 36, 0),0 0 16px 4px rgba(232,177,94,.55)}
  .pin-hit.on .pin .ring{animation:pulse 2.4s ease-out infinite}
  /* every other chapter, PIN_MODE "dim": still there, out of the way, not clickable */
  .pin-hit.dim{pointer-events:none;opacity:.62}
  .pin-hit.dim .pin i{background:#a7a7a7b0;transform:scale(.7);
    box-shadow:0 0 0 1.5px rgba(255, 255, 255, 0)}
  /* PIN_MODE "solo": everything but the current chapter goes away */
  .pin-hit.hide{opacity:0;pointer-events:none}
  @keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}

  /* ---------- POPUP (themed) ---------- */
  .maplibregl-popup{max-width:280px!important}
  .maplibregl-popup-content{
    background:var(--panel-2)!important;color:var(--text)!important;
    border:1px solid var(--line);border-radius:10px;padding:16px 18px 15px!important;
    box-shadow:0 18px 40px -16px rgba(0,0,0,.85);font-family:"IBM Plex Sans",sans-serif}
  .maplibregl-popup-close-button{color:var(--text-dim)!important;font-size:18px;
    width:26px;height:26px;right:3px;top:2px}
  .maplibregl-popup-close-button:hover{color:var(--gold)!important;background:transparent!important}
  /* tip colour for every anchor so the arrow matches the card */
  .maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
  .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
  .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip{border-top-color:var(--panel-2)!important}
  .maplibregl-popup-anchor-top .maplibregl-popup-tip,
  .maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
  .maplibregl-popup-anchor-top-right .maplibregl-popup-tip{border-bottom-color:var(--panel-2)!important}
  .maplibregl-popup-anchor-left .maplibregl-popup-tip{border-right-color:var(--panel-2)!important}
  .maplibregl-popup-anchor-right .maplibregl-popup-tip{border-left-color:var(--panel-2)!important}
  .pc-eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold-soft);margin:0 0 6px}
  .pc h4{font-family:"Fraunces",serif;font-weight:600;font-size:18px;line-height:1.12;
    margin:0 0 7px;color:#eef2f8}
  .pc p{font-size:13px;line-height:1.5;color:var(--text-dim);margin:0}
  .pc .prs{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;
    font-family:"IBM Plex Mono",monospace;font-size:11px}
  .pc .prs dt{color:#5a6a7d;letter-spacing:.08em;text-transform:uppercase;font-size:9.5px;
    padding-top:1px}
  .pc .prs dd{margin:0;color:var(--text)}
  .pc h4.fp{font-size:15px;margin:0 0 9px;color:var(--gold)}
  .pc .pc-meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#566374;margin-top:9px}
  /* popup logo: smaller, and kept clear of the close button */
  .pc{--logo-h:19px}
  .pc .logo{margin:0 0 10px}
  .pc .logolink{margin-bottom:10px}
  .pc .logolink .logo{margin-bottom:0}

  /* nav control tint */
  .maplibregl-ctrl-group{background:var(--panel-2)!important;border:1px solid var(--line)!important}
  .maplibregl-ctrl-group button{filter:invert(.85) hue-rotate(180deg)}
  .maplibregl-ctrl-attrib{background:rgba(10,15,22,.7)!important}
  .maplibregl-ctrl-attrib a{color:#7d8ca1!important}

  /* ---------- NARRATIVE ---------- */
  .intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:80px 0}
  .kicker{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--gold-soft);margin:0 0 18px}
  .intro h1{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(40px,5.2vw,76px);
    line-height:.98;margin:0 0 10px;color:#f3f6fb;letter-spacing:-.01em}
  .intro h1 .em{font-style:italic;font-weight:400;color:var(--gold)}
  .intro .role{font-size:clamp(16px,1.5vw,20px);color:var(--text-dim);margin:0 0 28px;font-weight:300}
  .scrollcue{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;
    color:var(--text-dim);text-transform:uppercase;display:flex;align-items:center;gap:10px}
  .scrollcue:after{content:"";width:1px;height:34px;background:linear-gradient(var(--gold),transparent);
    display:inline-block;animation:drop 1.8s ease-in-out infinite}
  @keyframes drop{0%,100%{opacity:.3;transform:translateY(-4px)}50%{opacity:1;transform:translateY(4px)}}

  .chapter{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:60px 0;border-top:1px solid var(--line)}
  .chapter .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold-soft);display:flex;gap:14px;align-items:baseline;margin:0 0 14px}
  .chapter .tag .num{color:#42526a}
  .chapter h2{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(26px,3vw,40px);
    line-height:1.04;margin:0 0 18px;color:#eef2f8;letter-spacing:-.01em}
  .chapter p{font-size:16px;line-height:1.72;color:var(--text);max-width:34em;margin:0 0 14px;font-weight:300}

  /* organisation logo mark. Height drives the size and width follows, so the
     SVG needs a viewBox; without one the browser has no aspect ratio to use.
     Deliberately NOT scoped to .chapter — the same rules dress the logo inside
     map popups, where .chapter is not an ancestor. */
  /* Size is driven by the custom property --logo-h, NOT by an inline height.
     A custom property can still be overridden by a media query further down,
     which an inline `style="height:..."` never could.
     max-width is a proportion of the column rather than a fixed 200px: a fixed
     cap pins the width while the height keeps growing, which squashes any logo
     wide enough to reach it. object-fit is the backstop — if both axes ever do
     get constrained, the image letterboxes instead of distorting. */
  .logo{display:block;height:var(--logo-h,28px);width:auto;max-width:100%;
    object-fit:contain;opacity:.82;transition:opacity .3s ease}
  /* white:true — turns any logo, whatever its colours, into a white silhouette.
     brightness(0) flattens it to black keeping alpha, invert(1) makes it white.
     Saves maintaining a separate white export of every logo. */
  .logo.white{filter:brightness(0) invert(1)}
  /* the wrapper when logo.link is set: no underline, no baseline gap */
  .logolink{display:inline-flex;align-items:center;border-bottom:0}
  .logolink:hover{border-bottom:0}
  .logolink:hover .logo{opacity:1}
  .logolink:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:2px}
  .chapter .meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--text-dim);margin-top:6px;letter-spacing:.02em}
  .chapter .meta b{color:var(--gold-soft);font-weight:500}
  /* logo + meta on one line; wraps to two if the logo is wide or space is tight */
  .metarow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;
    --logo-h:26px}
  .metarow .meta{margin-top:0}
  /* never let the flex algorithm shrink the logo horizontally against a long
     meta line — that narrows the width while the height stays put */
  .metarow .logo,.metarow .logolink{flex:0 0 auto}
  .metarow .meta{flex:1 1 auto;min-width:12em}
  @media (max-width:900px){
    .metarow{gap:11px}
    /* scales whatever h was configured, instead of overriding it outright */
    .logo{height:calc(var(--logo-h,28px) * .72)}
  }
  .hint{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#566374;margin-top:4px}

  /* ---------- EXPANDABLE DETAIL (thesis / projects / key-value rows) ---------- */
  .more{margin-top:20px;max-width:34em}
  .more-btn{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold-soft);background:transparent;
    border:1px solid var(--line);border-radius:5px;padding:7px 13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:10px;transition:border-color .2s,color .2s}
  .more-btn:hover{border-color:var(--gold-soft);color:var(--gold)}
  .more-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .more-btn .chev{font-size:8px;color:#5a6a7d;transition:transform .3s ease}
  .more-btn[aria-expanded="true"] .chev{transform:rotate(90deg);color:var(--gold)}
  /* 0fr -> 1fr animates the panel open without hard-coding a height */
  .more-panel{display:grid;grid-template-rows:0fr;opacity:0;
    transition:grid-template-rows .42s ease,opacity .3s ease}
  .more-panel>.more-inner{overflow:hidden}
  .more-panel.open{grid-template-rows:1fr;opacity:1}
  .more-inner>*:first-child{margin-top:20px}

  /* NOTE: `.chapter p` is (0,1,1) and would beat a bare `.pbody` class, so every
     paragraph rule below is scoped to .more-inner to raise it to (0,2,0). */
  .dblock+.dblock{margin-top:24px}
  .more-inner .dlabel{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold-soft);margin:0 0 11px;max-width:none}
  .more-inner .dtitle{font-family:"Fraunces",serif;font-weight:600;font-size:17px;line-height:1.25;
    color:#eef2f8;margin:0 0 6px}
  .more-inner .dbody{font-size:14.5px;line-height:1.65;color:var(--text-dim);margin:0}

  .plist{list-style:none;margin:0;padding:0}
  .plist li{position:relative;padding-left:17px;border-left:1px solid var(--line);padding-bottom:17px}
  .plist li:last-child{padding-bottom:0;border-left-color:transparent}
  .plist li:before{content:"";position:absolute;left:-3px;top:7px;width:5px;height:5px;
    border-radius:50%;background:var(--gold-soft)}
  .more-inner .pname{font-size:15px;color:#e6ecf5;margin:0 0 4px;font-weight:400;line-height:1.35}
  .more-inner .pname a{color:#e6ecf5}
  .more-inner .pname a:hover{color:var(--cyan);border-color:var(--cyan)}
  .pwhen{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#566374;
    margin-left:10px;letter-spacing:.06em}
  .more-inner .pbody{font-size:13.5px;line-height:1.62;color:var(--text-dim);margin:0}

  /* ---------- LAYER TOGGLES (projects that load data) ---------- */
  .plist li.live{transition:border-left-color .3s ease}
  .plist li.live.on{border-left-color:var(--gold-soft)}
  .play{background:transparent;border:0;padding:0;margin:0;cursor:pointer;text-align:left;
    display:inline-flex;align-items:baseline;gap:9px;font:inherit;color:#e6ecf5;
    border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
  .play:hover{color:var(--cyan);border-bottom-color:var(--cyan)}
  .play:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  .play[aria-pressed="true"]{color:var(--gold);border-bottom-color:transparent}
  .play .glyph{flex:0 0 auto;width:13px;height:13px;align-self:center;
    fill:none;stroke:currentColor;stroke-width:1.1;opacity:.65;transition:opacity .2s}
  .play:hover .glyph,.play[aria-pressed="true"] .glyph{opacity:1}
  .play[aria-pressed="true"] .glyph .top{fill:var(--gold);fill-opacity:.28}
  /* thesis title is a bigger target: inherits Fraunces from .dtitle */
  .more-inner .dtitle .play{color:#eef2f8;align-items:center}
  .more-inner .dtitle .play:hover{color:var(--cyan)}
  .more-inner .dtitle .play[aria-pressed="true"]{color:var(--gold)}
  .more-inner .dtitle .play .glyph{width:15px;height:15px}
  .more-inner .plink{font-family:"IBM Plex Mono",monospace;font-size:11px;margin:6px 0 0}  .more-inner .pstatus{font-family:"IBM Plex Mono",monospace;font-size:11px;margin:6px 0 0;
    color:#566374;letter-spacing:.04em}
  .more-inner .pstatus.err{color:#d98a7a}
  .pstatus .dot{display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--cyan);margin-right:7px;vertical-align:1px;animation:blink 1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

  /* ---------- LEGEND ---------- */
  .legend{position:absolute;left:18px;top:18px;z-index:5;min-width:132px;max-width:214px;
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--text-dim);
    background:rgba(10,15,22,.72);backdrop-filter:blur(6px);border:1px solid var(--line);
    border-radius:6px;padding:10px 12px 11px;pointer-events:none;letter-spacing:.02em}
  .legend h5{margin:0 0 8px;font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);font-weight:500}
  .legend .bar{height:7px;border-radius:2px;margin-bottom:5px}
  .legend .ends{display:flex;justify-content:space-between;color:#6b7b8f}
  .legend .lgroup+.lgroup{margin-top:11px}
  .legend .glab{margin:0 0 6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold-soft);font-weight:500;opacity:.9}
  .legend .lnote{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
    color:#5a6a7d;font-size:9.5px;line-height:1.45;letter-spacing:0}
  .legend .sw{display:flex;align-items:flex-start;gap:8px;margin-top:5px;line-height:1.35}
  .legend .sw i{width:11px;height:11px;border-radius:2px;flex:0 0 auto;margin-top:1px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
  .legend .sw i.s-dot{border-radius:50%}
  /* clip-path rather than the border trick, so the colour still comes from
     background and the swatch list stays uniform */
  .legend .sw i.s-tri{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0;
    box-shadow:none;width:12px;height:11px}
  .legend .sw i.s-star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,
    50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);border-radius:0;box-shadow:none;
    width:13px;height:13px}
  /* a line-symbol reads as a rule, not a chip */
  .legend .sw i.s-line{height:2px;width:14px;border-radius:1px;box-shadow:none;
    margin-top:6px}
  /* lithology tiles need the room: an 11px swatch turns bricks into mush */
  .legend .sw i.s-pat{width:19px;height:19px;border-radius:2px;
    image-rendering:auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
  .hud .probe{color:var(--cyan)}

  /* ---------- TOMOGRAPHY CONTROL ---------- */
  .tomo{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;
    display:flex;flex-direction:column;gap:10px;align-items:stretch;
    background:rgba(10,15,22,.86);backdrop-filter:blur(7px);border:1px solid var(--line);
    border-radius:8px;padding:12px 16px 14px;box-shadow:0 8px 26px rgba(0,0,0,.5);
    font-family:"IBM Plex Mono",monospace}
  .tomo .fields{display:flex;gap:5px;justify-content:center}
  .tomo .fields button{font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-dim);background:transparent;border:1px solid var(--line);
    border-radius:4px;padding:5px 10px;cursor:pointer;transition:all .2s}
  .tomo .fields button:hover{color:var(--gold-soft);border-color:var(--gold-soft)}
  .tomo .fields button[aria-pressed="true"]{color:#0a0f16;background:var(--gold);
    border-color:var(--gold)}
  .tomo .depth{display:flex;align-items:center;gap:12px}
  .tomo input[type=range]{flex:1 1 auto;width:210px;accent-color:var(--gold);cursor:pointer}
  .tomo .zlab{font-size:11px;color:var(--gold);min-width:74px;text-align:right;letter-spacing:.04em}
  .tomo .hint{font-size:9.5px;color:#5a6a7d;text-align:center;letter-spacing:.06em;margin:0}
  @media (max-width:900px){
    .tomo{bottom:12px;padding:9px 12px 11px;gap:7px}
    .tomo input[type=range]{width:140px}
    .tomo .zlab{font-size:10px;min-width:64px}
  }

  /* ---------- 3D SCENE OVERLAY ----------
     A Qgis2threejs export is a whole standalone page, so it is mounted in an
     iframe over the map pane rather than rebuilt as MapLibre layers. It only
     loads when the reader asks for it — three.js plus a DEM is not something
     to download on page load. */
  /* top-right: the depth slider owns the bottom-centre, the legend the top-left,
     and MapLibre's zoom control the bottom-right */
  .scene-launch{position:absolute;right:18px;top:18px;z-index:6;
    display:inline-flex;align-items:center;gap:9px;cursor:pointer;
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold);background:rgba(10,15,22,.84);
    backdrop-filter:blur(6px);border:1px solid var(--gold-soft);border-radius:6px;
    padding:9px 15px;box-shadow:0 6px 22px rgba(0,0,0,.45);
    transition:background .2s,color .2s,box-shadow .2s}
  .scene-launch:hover{background:var(--gold);color:#0a0f16;
    box-shadow:0 0 22px rgba(232,177,94,.38)}
  .scene-launch:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  .scene-launch .cube{font-size:13px;line-height:1}

  .scene-frame{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;
    background:#0a0f16;animation:sceneIn .3s ease}
  @keyframes sceneIn{from{opacity:0}to{opacity:1}}
  .scene-bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:9px 13px;
    border-bottom:1px solid var(--line);background:rgba(10,15,22,.96);
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-dim);
    letter-spacing:.05em}
  .scene-bar .st{color:var(--gold-soft);text-transform:uppercase;letter-spacing:.18em;font-size:10px}
  .scene-bar .sp{margin-left:auto;display:flex;gap:15px;align-items:center}
  .scene-bar button{background:transparent;border:0;color:var(--text-dim);cursor:pointer;
    font:inherit;padding:3px 7px;border-radius:4px;transition:color .2s}
  .scene-bar button:hover{color:var(--gold)}
  .scene-bar button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .scene-frame iframe{flex:1 1 auto;width:100%;border:0;background:#0a0f16}
  @media (max-width:900px){
    .scene-launch{right:12px;top:12px;font-size:10px;padding:7px 10px}
    .scene-bar{padding:7px 10px;font-size:10px}
  }
  @media (max-width:900px){
    .legend{left:12px;top:12px;font-size:9.5px;padding:8px 10px 9px;min-width:112px;
      max-width:170px}
    .legend .sw{gap:6px;margin-top:4px}
    .legend .sw i{width:9px;height:9px}
  }

const LL = c => [c[1], c[0]];   // [lat,lng] -> [lng,lat] for MapLibre

/* ---------- PIN VISIBILITY -----------------------------------------------
   How pins for chapters you are NOT reading should behave:
     "dim"  pale grey, smaller, not clickable — keeps the shape of the whole
            CV visible on the map while the current chapter stands out
     "solo" hidden completely — only the current chapter's pin exists
     "all"  every pin gold and clickable at all times
   ------------------------------------------------------------------------ */
const PIN_MODE = "dim";

/* ---------- PANELS -------------------------------------------------------
   Whether the "Read more" panels start open:
     true      open everywhere
     false     closed everywhere, the reader opens what interests them
     "desktop" open on wide screens, collapsed on narrow ones so a phone
               is not handed the entire CV in one scroll
   A single chapter can override this with `open:true` / `open:false`.
   Evaluated once at build time, so resizing will not re-run it.
   ------------------------------------------------------------------------ */
const PANELS_OPEN = true;

/* ---------- CAMERA SPEED -------------------------------------------------
   mode decides what happens between chapters:

     "duration"  every flight takes the same time, so the hop to the next
                 suburb and the hop to the Canaries both take FLIGHT.duration.
                 Predictable, but long jumps feel rushed.
     "speed"     the time comes from the distance, so the camera moves at a
                 roughly constant velocity — short hops are quick, long ones
                 take longer, capped at maxDuration.

   speed is in MapLibre's "zoom levels per second" terms; 1.2 is its default
   and lower is slower. curve is how far the camera pulls back on the way:
   raise it for a bigger arc, 1 for a flat path.

   Any chapter can override with `speed:` or `duration:`; a duration always
   wins, because MapLibre ignores speed when a duration is given.
   ------------------------------------------------------------------------ */
const FLIGHT = {
  mode:        "duration",
  duration:    1500,   // ms per flight            (mode "duration")
  speed:        1.2,   // velocity instead of time (mode "speed")
  maxDuration: 4500,   // ms ceiling on long flights
  curve:       1.42,   // arc of the flight path
  frame:       1400,   // ms, framing a dataset once it loads
  camera:      1800,   // ms, moving to a project's explicit camera
  reset:        700    // ms, returning pitch and bearing to flat
};

/* Readers whose OS asks for less motion get instant cuts. The chapter flight
   used to pass essential:true, which explicitly overrode that preference. */
const LESS_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)");
const still = o => LESS_MOTION.matches ? Object.assign({}, o, {duration:0}) : o;

/* Motion for a project's camera move. speed, curve and maxDuration exist only
   on flyTo, so anything asking for speed has to fly; a plain duration still
   eases, which stops short moves from swooping out and back in. `src` is either
   the project itself (automatic framing) or its `camera` object. */
function projectMotion(src, fallback){
  // duration always wins, exactly as it does for chapters, and as MapLibre
  // itself decides: flyTo ignores speed whenever a duration is given
  if(src.duration!==undefined) return {fly:false, opts:{duration:src.duration}};
  const speed = src.speed ?? (FLIGHT.mode==="speed" ? FLIGHT.speed : undefined);
  if(speed!==undefined) return {fly:true, opts:{
    speed, curve:src.curve ?? FLIGHT.curve,
    maxDuration:src.maxDuration ?? FLIGHT.maxDuration }};
  return {fly:false, opts:{duration:fallback}};
}

function flightOpts(s){
  const curve = s.curve ?? FLIGHT.curve;
  if(s.duration!==undefined)                              // explicit time wins
    return {duration:s.duration, curve};
  if(s.speed!==undefined || FLIGHT.mode==="speed")         // velocity-based
    return {speed:s.speed ?? FLIGHT.speed, maxDuration:FLIGHT.maxDuration, curve};
  return {duration:FLIGHT.duration, curve};
}

/* ---------- BASEMAP -----------------------------------------------------
   OpenFreeMap "Positron" — light vector basemap (free, no API key).
   Vector tiles are tiny and zoom continuously, so camera flights stay smooth
   with none of the raster tile pop-in you get from satellite imagery.
   Label layers are stripped on load (see map "load" handler) to keep the
   clean, pin-only look. Swap this URL for any other style to change basemap.
   ------------------------------------------------------------------------ */
const basemapStyle = "https://tiles.openfreemap.org/styles/positron";

const map = new maplibregl.Map({
  container:"map", style:basemapStyle,
  center:LL(STORY[0].coords), zoom:STORY[0].zoom,
  attributionControl:{compact:true},
  fadeDuration:0                    // snap tiles in instantly, no cross-fade lag
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}), "bottom-right");
map.scrollZoom.enable();           // cursor over map → wheel zooms (and won't scroll the page)
/* Rotation stays enabled so terrain can be orbited. The 2D chapters still
   open flat, because clearData() returns pitch and bearing to zero whenever a
   dataset is dismissed or the chapter changes. */
let styleReady=false;
map.on("load", ()=>{
  // remove every text/label layer so only the pins carry context
  map.getStyle().layers.forEach(l=>{ if(l.type==="symbol") map.removeLayer(l.id); });
  map.resize();
  styleReady=true;
});
function whenReady(fn){ styleReady ? fn() : map.once("load", fn); }

/* =========================================================================
   LAYER ENGINE
   One project's data at a time. Clicking a project loads its layers, clicking
   it again removes them, and changing chapter removes them automatically.

   A project gets a clickable toggle by adding `layer` (one) or `layers` (many):

     layer:{ type:"geojson", data:"./data/sites.geojson", color:"#5fd0d8" }

   TYPES
     geojson : data = URL string or inline object. Fetched here (not by
               MapLibre) so we can auto-fit the extent and report errors.
               Fill / line / circle sub-layers are added by geometry type.
               Must be WGS84 — reproject out of EPSG:2100 first, or ask
               GeoServer WFS for srsName=EPSG:4326.
     cog     : Cloud Optimized GeoTIFF, must be EPSG:3857. Optional
               `colorRamp:"BrewerRdYlGn9,-0.2,0.8,c"` for single-band data.
     dem     : single-band COG as terrain and/or hillshade.
               terrain:true      3D relief
               hillshade:true    shading (works alongside terrain)
               hillshade:false   never shade
               shade:.6          shading strength
               sun:335           illumination direction in degrees
     wms     : GeoServer (or any) WMS. url + layers, reprojected server-side.
     xyz     : pre-rendered tile pyramid, e.g. gdal2tiles output.
     image   : static PNG/JPG pinned to four corner coordinates.

   status -> the line shown under a project once its data has loaded.
   Defaults to "on the map"; set it per project to say something specific, e.g.
   status:"3D model ready" or status:"111 contours, 5 m interval".

   Motion per project: speed:0.8 (or duration:2200) for the automatic framing;
   the same keys inside `camera` for an explicit one. speed makes it fly,
   duration makes it ease — see FLIGHT at the top of the script.

   Optional per project: camera:{center?,zoom?,pitch?,bearing?} for a tilted
   view (terrain needs one — relief is invisible from straight overhead),
   bounds:[[w,s],[e,n]] to frame the data,
   legend:{...} for the map legend, probe:{...} to read raster values on hover.
   ========================================================================= */

const COG_PLUGIN = "https://unpkg.com/@geomatico/maplibre-cog-protocol@0.9.0/dist/index.js";
let cogLoading=null;
function ensureCOG(){
  if(cogLoading) return cogLoading;
  cogLoading=new Promise((resolve,reject)=>{
    const register=()=>{
      try{ maplibregl.addProtocol("cog", MaplibreCOGProtocol.cogProtocol); resolve(); }
      catch(err){ reject(err); }
    };
    // already on the page? then it has been self-hosted via a <script> tag,
    // which is worth doing if you would rather not depend on a CDN
    if(window.MaplibreCOGProtocol) return register();
    const sc=document.createElement("script");
    sc.src=COG_PLUGIN; sc.crossOrigin="anonymous";
    // without a timeout a blocked or slow CDN leaves the reader on "loading"
    // for ever, because a stalled script fires neither load nor error
    const bail=setTimeout(()=>reject(new Error("COG plugin timed out")),12000);
    sc.onload=()=>{ clearTimeout(bail); register(); };
    sc.onerror=()=>{ clearTimeout(bail); reject(new Error("COG plugin failed to load")); };
    document.head.appendChild(sc);
  });
  // a failed attempt must not be cached, or a retry can never succeed
  cogLoading.catch(()=>{ cogLoading=null; });
  return cogLoading;
}

/* extent of any GeoJSON, so the camera can frame what just loaded */
function bboxOf(gj){
  let w=180,s=90,e=-180,n=-90,hit=false;
  const walk=c=>{
    if(typeof c[0]==="number"){
      hit=true; w=Math.min(w,c[0]); e=Math.max(e,c[0]);
      s=Math.min(s,c[1]); n=Math.max(n,c[1]); return;
    }
    c.forEach(walk);
  };
  const geom=g=>{
    if(!g) return;
    if(g.type==="GeometryCollection") g.geometries.forEach(geom);
    else if(g.coordinates) walk(g.coordinates);
  };
  if(gj.type==="FeatureCollection") (gj.features||[]).forEach(f=>geom(f.geometry));
  else if(gj.type==="Feature") geom(gj.geometry);
  else geom(gj);
  return hit ? [[w,s],[e,n]] : null;
}

/* Point markers can be triangles: MapLibre circle layers only draw circles, so
   the icon is painted to a canvas once, registered as a map image under a name
   derived from its colours (so it is reused, never duplicated), and drawn by a
   symbol layer. Returns null wherever a 2-D context is unavailable, and the
   caller falls back to circles. */
function triangleIcon(fill, stroke){
  const id = "tri-" + String(fill).replace(/[^\w]/g,"") + "-" + String(stroke).replace(/[^\w]/g,"");
  try{
    if(map.hasImage && map.hasImage(id)) return id;
    const S=28, c=document.createElement("canvas");
    c.width=c.height=S;
    const g=c.getContext("2d");
    if(!g) return null;
    g.beginPath();
    g.moveTo(S/2, 3.5); g.lineTo(S-3.5, S-5); g.lineTo(3.5, S-5); g.closePath();
    g.fillStyle=fill; g.fill();
    g.lineWidth=2.4; g.lineJoin="round"; g.strokeStyle=stroke; g.stroke();
    map.addImage(id, g.getImageData(0,0,S,S), {pixelRatio:2.8});
    return id;
  }catch(e){ return null; }
}

/* A five-pointed star, drawn the same way as the triangle above: painted once,
   registered under a name derived from its colours, reused thereafter. The dark
   keyline is what keeps a white star readable over a pale basemap. */
function starIcon(fill, stroke){
  const id = "star-" + String(fill).replace(/[^\w]/g,"") + "-" + String(stroke).replace(/[^\w]/g,"");
  try{
    if(map.hasImage && map.hasImage(id)) return id;
    const S=44, c=document.createElement("canvas");
    c.width=c.height=S;
    const g=c.getContext("2d");
    if(!g) return null;
    const cx=S/2, cy=S/2, R=S/2-4, r=R*.44;
    g.beginPath();
    for(let i=0;i<10;i++){
      const a=-Math.PI/2 + i*Math.PI/5, rad=(i%2)?r:R;
      const x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad;
      i?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.closePath();
    g.fillStyle=fill; g.fill();
    // a white star over a pale basemap survives on its keyline alone, so the
    // line is heavy and the shadow gives it a little lift off the scatterers
    g.lineWidth=3.2; g.lineJoin="round"; g.strokeStyle=stroke;
    g.shadowColor="rgba(10,15,22,.45)"; g.shadowBlur=3.5; g.stroke();
    g.shadowBlur=0;
    map.addImage(id, g.getImageData(0,0,S,S), {pixelRatio:2.6});
    return id;
  }catch(e){ return null; }
}

/* ---- FGDC-style lithology ornament ---------------------------------------
   A geological map carries the unit colour *and* an overprinted lithology
   pattern — bricks for limestone, stipple for sandstone, dashes for shale
   (FGDC-STD-013-2006). MapLibre fills with an image rather than a pattern
   definition, so each (lithology, colour) pair is painted to a 48-px canvas
   once, registered with map.addImage under a name derived from the pair, and
   shared by every feature that uses it. The unit colour is baked into the tile
   at low alpha, which lets `fill-opacity` stay at 1 so the ink stays crisp
   instead of fading with the wash underneath it.

   Every tile is drawn on a period that divides 48, so the pattern is seamless
   across tile boundaries. */
const INK="#0d141c", TILE=48, WASH_A=.34, INK_A=.85;

/* Unit name -> lithology class. Greek first — these are IGME sheet names — with
   English as a fallback. First match wins, so put the specific before the
   general (marble before limestone, breccia before conglomerate). */
const LITHO_KEYS=[
  [/κροκαλοπαγ|conglomer/i,                              "conglomerate"],
  [/λατυποπαγ|breccia|brecc/i,                           "breccia"],
  [/κορήμ|κορημ|πλευρικ|scree|talus/i,                   "scree"],
  [/αλλούβ|αλλουβ|προσχώσ|προσχωσ|alluvi|ποταμ|fluvial/i,"alluvium"],
  [/μάρμαρ|μαρμαρ|marble/i,                              "marble"],
  [/δολομ|dolomit/i,                                     "dolomite"],
  [/ασβεστόλιθ|ασβεστολιθ|ασβεστ|limestone|calcar/i,     "limestone"],
  [/τραβερτίν|τραβερτιν|travertin|τούφ|tufa/i,           "travertine"],
  [/ψαμμίτ|ψαμμιτ|sandstone|άμμ|sand/i,                  "sandstone"],
  [/μάργ|μαργ|marl/i,                                    "marl"],
  [/άργιλ|αργιλ|ιλύ|ιλυ|clay|shale|silt|mudstone/i,      "shale"],
  [/φλύσχ|φλυσχ|flysch|τουρβιδ|turbidit/i,               "flysch"],
  [/σχιστ|φυλλίτ|φυλλιτ|schist|phyllit|γνεύσ|gneiss/i,   "schist"],
  [/οφιόλ|οφιολ|σερπεντ|περιδοτ|ophiolit|serpentin|peridot/i,"ophiolite"],
  [/κερατόλ|κερατολ|ραδιολαρ|chert|radiolar/i,           "chert"],
  [/ηφαιστ|ανδεσίτ|ανδεσιτ|λάβ|volcan|andesit|basalt|lava|tuff/i,"volcanic"],
  [/γρανίτ|γρανιτ|διορίτ|διοριτ|πλουτ|granit|diorit|pluton|gabbro/i,"plutonic"]
];
const LITHO_LABEL={
  conglomerate:"Conglomerate", breccia:"Breccia", scree:"Scree / talus",
  alluvium:"Alluvium", marble:"Marble", dolomite:"Dolomite",
  limestone:"Limestone", travertine:"Travertine", sandstone:"Sandstone",
  marl:"Marl", shale:"Clay / shale", flysch:"Flysch", schist:"Schist",
  ophiolite:"Ophiolite / serpentinite", chert:"Chert / radiolarite",
  volcanic:"Volcanic", plutonic:"Plutonic", none:"Undifferentiated"
};
function lithoOf(txt){
  const s=String(txt||"");
  for(const [re,k] of LITHO_KEYS) if(re.test(s)) return k;
  return "none";
}

const _ln=(g,x1,y1,x2,y2)=>{ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); };
const _dot=(g,x,y,r)=>{ g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill(); };
const _poly=(g,pts,fill)=>{ g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
  g.closePath(); fill?g.fill():g.stroke(); };

/* One function per lithology, each drawing into a 48x48 tile. */
const LITHO_DRAW={
  limestone(g){ const h=12,w=24;
    for(let r=0;r<4;r++){ const y=r*h; _ln(g,0,y,TILE,y);
      for(let x=(r%2)*w/2;x<TILE;x+=w) _ln(g,x,y,x,y+h); } },
  dolomite(g){ const h=12,w=24;                      // bricks sheared, per FGDC
    for(let r=0;r<4;r++){ const y=r*h; _ln(g,0,y,TILE,y);
      for(let x=(r%2)*w/2;x<TILE;x+=w) _ln(g,x,y,x+5,y+h); } },
  marble(g){ LITHO_DRAW.limestone(g);                // bricks + diagonal ruling
    for(let i=-TILE;i<TILE*2;i+=24) _ln(g,i,0,i+TILE,TILE); },
  travertine(g){ LITHO_DRAW.limestone(g);            // bricks + vugs
    [[12,6],[36,18],[6,30],[30,42]].forEach(([x,y])=>{
      g.beginPath(); g.arc(x,y,2.2,0,6.2832); g.stroke(); }); },
  sandstone(g){ for(let r=0;r<6;r++) for(let i=0;i<6;i++)
      _dot(g, i*8+(r%2?4:0)+2, r*8+3, 1.15); },
  shale(g){ for(let r=0;r<6;r++){ const y=r*8+4, o=(r%2)*12;
      for(let x=-24;x<TILE;x+=24) _ln(g,x+o,y,x+o+14,y); } },
  marl(g){ for(let r=0;r<4;r++){ const y=r*12+6, o=(r%2)*12;   // dash-and-dot
      for(let x=-24;x<TILE;x+=24){ _ln(g,x+o,y,x+o+12,y); _dot(g,x+o+18,y,1.3); } } },
  flysch(g){ for(let r=0;r<4;r++){ const y=r*12+6;   // sandstone/shale rhythm
      if(r%2){ for(let x=0;x<TILE;x+=8) _dot(g,x+4,y,1.1); }
      else   { for(let x=-24;x<TILE;x+=24) _ln(g,x,y,x+16,y); } } },
  schist(g){ for(let r=0;r<4;r++){ const y=r*12+6;   // schistosity
      g.beginPath();
      for(let x=0;x<=TILE;x++){ const yy=y+Math.sin(x/TILE*Math.PI*4)*2.2;
        x?g.lineTo(x,yy):g.moveTo(x,yy); }
      g.stroke(); } },
  ophiolite(g){ for(let i=-TILE;i<TILE*2;i+=16){     // cross-hatch
      _ln(g,i,0,i+TILE,TILE); _ln(g,i,TILE,i+TILE,0); } },
  chert(g){ for(let r=0;r<3;r++) for(let i=0;i<3;i++){
      const x=i*16+8+(r%2?8:0), y=r*16+8;
      _ln(g,x-3,y-3,x+3,y+3); _ln(g,x-3,y+3,x+3,y-3); } },
  volcanic(g){ for(let r=0;r<2;r++) for(let i=0;i<2;i++){
      const x=i*24+(r%2?12:0)+7, y=r*24+9;
      _ln(g,x,y,x+5,y+9); _ln(g,x+5,y+9,x+10,y); } },
  plutonic(g){ for(let r=0;r<3;r++) for(let i=0;i<3;i++){
      const x=i*16+8+(r%2?8:0), y=r*16+8;
      _ln(g,x-3.5,y,x+3.5,y); _ln(g,x,y-3.5,x,y+3.5); } },
  conglomerate(g){ [[9,10,5,3.4],[28,7,3.6,2.6],[41,17,4.4,3],[14,28,4.2,3],
      [33,31,5,3.4],[6,41,3.4,2.4],[24,44,4,2.8],[44,39,3,2.2]]
      .forEach(([x,y,rx,ry])=>{ g.beginPath(); g.ellipse(x,y,rx,ry,.4,0,6.2832); g.stroke(); }); },
  breccia(g){ [[10,12,7],[31,9,5.5],[42,23,6],[16,31,6.5],[34,37,7],[7,43,5]]
      .forEach(([x,y,s])=>_poly(g,[[x,y-s*.6],[x+s*.7,y+s*.5],[x-s*.6,y+s*.55]],false)); },
  scree(g){ [[9,9,4],[27,14,3.2],[40,8,3.6],[17,26,3.4],[36,30,4],[8,38,3.2],
      [28,42,3.6],[44,43,3]]
      .forEach(([x,y,s])=>_poly(g,[[x,y-s*.6],[x+s*.6,y+s*.5],[x-s*.6,y+s*.5]],true)); },
  alluvium(g){ for(let r=0;r<3;r++){ const y=r*16+8, o=(r%2)*12;
      for(let x=-24;x<TILE;x+=24) _ln(g,x+o,y,x+o+9,y);
      for(let x=0;x<TILE;x+=24) _dot(g,x+(r%2?4:16),y+8,1.3); } },
  none(){}
};

/* id -> data URL, so the legend can show the same tile as a CSS background */
const lithoURL={};
function lithoPattern(litho, colour){
  const key=`lp-${litho}-${String(colour).replace(/[^\w]/g,"")}`;
  if(map.hasImage && map.hasImage(key)) return key;
  try{
    const c=document.createElement("canvas");
    c.width=c.height=TILE;
    const g=c.getContext("2d");
    if(!g) return null;
    g.globalAlpha=WASH_A; g.fillStyle=colour; g.fillRect(0,0,TILE,TILE);
    g.globalAlpha=INK_A;  g.fillStyle=INK; g.strokeStyle=INK;
    g.lineWidth=1.4; g.lineCap="round"; g.lineJoin="round";
    (LITHO_DRAW[litho]||LITHO_DRAW.none)(g);
    lithoURL[key]=c.toDataURL();
    // 1.5 puts a ~32 CSS-px tile on the map: close to the ornament size a
    // printed sheet uses, and still oversampled on a retina display
    map.addImage(key, g.getImageData(0,0,TILE,TILE), {pixelRatio:1.5});
    return key;
  }catch(e){ return null; }
}


const POLY=["match",["geometry-type"],["Polygon","MultiPolygon"],true,false];
const LINE=["match",["geometry-type"],["LineString","MultiLineString"],true,false];
const PT  =["match",["geometry-type"],["Point","MultiPoint"],true,false];

/* live = what is currently on the map; emptied by clearData() */
const legendBox=document.getElementById("legend");
const hudProbe=document.getElementById("hud-probe");
let probeSpec=null, probeAt=0;
/* popupPts = the point layers that carry their own popup. They win a click over
   the polygons underneath them, so a scatterer never drags a formation card
   along with it. */
const live={key:null, layers:[], sources:[], terrain:false, btn:null, host:null,
            handlers:[], popupPts:[], litho:[]};

function clearData(){
  // detach feature popups before their layers go, or the handlers leak
  live.handlers.forEach(([ev,id,fn])=>{ try{ map.off(ev,id,fn); }catch(e){} });
  live.handlers=[];
  map.getCanvas && (map.getCanvas().style.cursor="");
  live.layers.forEach(id=>{ if(map.getLayer(id)) map.removeLayer(id); });
  if(live.terrain){ try{ map.setTerrain(null); }catch(e){} live.terrain=false; }
  live.sources.forEach(id=>{ if(map.getSource(id)) map.removeSource(id); });
  live.layers=[]; live.sources=[]; live.popupPts=[]; live.litho=[];
  if(live.btn){
    live.btn.setAttribute("aria-pressed","false");
    live.host && live.host.classList.remove("on");
    const st=live.host && live.host.querySelector(".pstatus");
    if(st){ st.textContent=""; st.classList.remove("err"); }
  }
  live.btn=null; live.host=null; live.key=null;
  tomoLegend=null;
  clearScene();
  if(map.getPitch()||map.getBearing())
    map.easeTo(still({pitch:0,bearing:0,duration:FLIGHT.reset}));
  setLegend(null);
  probeSpec=null; hudProbe.hidden=true;
}

/* ---- source + layer construction, one branch per type ---- */
async function addSpec(spec,i,key){
  const sid=`d-${key}-${i}`, base=`l-${key}-${i}`;
  const op = spec.opacity===undefined ? 0.85 : spec.opacity;

  if(spec.type==="geojson"){
    let gj=spec.data;
    if(typeof gj==="string"){
      const r=await fetch(gj);
      if(!r.ok) throw new Error(`${r.status} fetching ${gj.split("/").pop()}`);
      gj=await r.json();
    }
    const col=spec.color||"var-gold";
    const c=col==="var-gold"?"#e8b15e":col;
    const P=spec.paint||{};
    const fillPaint=Object.assign({"fill-color":c,"fill-opacity":.22},P.fill||{});

    /* `lithology:{field,colour}` turns a unit polygon layer into a proper
       geological sheet: the class is read off the unit name, the pattern is
       baked with that unit's own colour, and the tile name is stored on the
       feature so the paint can be a plain ["get","pat"]. Units whose name
       matches nothing keep the flat wash and are reported to the console so
       the keyword table can be extended.

       This has to run BEFORE addSource: a GeoJSON source hands its data to the
       worker as soon as it is added, so a property written afterwards never
       reaches the tiles the paint is evaluated against. */
    if(spec.lithology){
      const L=spec.lithology, nameField=L.field||"name", colField=L.colour||"col";
      const seen=new Map(), missed=new Set();
      let ok=0;
      (gj.features||[]).forEach(f=>{
        const p=f.properties||(f.properties={});
        const k=lithoOf(p[nameField]!=null?p[nameField]:p.code);
        const uc=p[colField]||c;
        const id=lithoPattern(k,uc);
        if(id){ p.pat=id; ok++; }
        if(k==="none") missed.add(String(p[nameField]||p.code||"?"));
        else if(!seen.has(k)) seen.set(k,[uc,LITHO_LABEL[k]||k,id]);
      });
      if(ok){
        fillPaint["fill-pattern"]=["get","pat"];
        fillPaint["fill-opacity"]=L.opacity??1;     // alpha is baked into the tile
        // single quotes inside url(): the swatch goes into a double-quoted
        // style attribute, and a double-quoted data URL would close it
        seen.forEach(([uc,label,id])=>live.litho.push([
          lithoURL[id]?`url('${lithoURL[id]}') center/19px 19px, ${uc}`:uc,
          label, lithoURL[id]?"pat":"box"]));
      }
      if(missed.size) console.warn("[geo-cv] no lithology matched:",[...missed].join(" · "));
    }

    map.addSource(sid,{type:"geojson",data:gj});
    live.sources.push(sid);

    map.addLayer({id:`${base}-fill`,type:"fill",source:sid,filter:POLY,
      paint:fillPaint});
    map.addLayer({id:`${base}-line`,type:"line",source:sid,
      filter:["any",POLY,LINE],
      paint:Object.assign({"line-color":c,"line-width":1.6,"line-opacity":.9},P.line||{})});
    const icon = spec.shape==="triangle"
      ? triangleIcon(spec.fill||c, spec.stroke||"#16202b")
      : spec.shape==="star"
        ? starIcon(spec.fill||"#ffffff", spec.stroke||"#16202b") : null;
    if(icon){
      map.addLayer({id:`${base}-pt`,type:"symbol",source:sid,filter:PT,
        layout:Object.assign({"icon-image":icon,"icon-size":spec.iconSize??0.5,
          "icon-allow-overlap":true,"icon-ignore-placement":true}, P.layout||{})});
    }else{
      map.addLayer({id:`${base}-pt`,type:"circle",source:sid,filter:PT,
        paint:Object.assign({"circle-radius":4.5,"circle-color":c,"circle-opacity":.9,
          "circle-stroke-width":1,"circle-stroke-color":"#0a0f16"},P.circle||{})});
    }
    live.layers.push(`${base}-fill`,`${base}-line`,`${base}-pt`);

    /* Click popups. `popup` is a list of [property, label, suffix?] rows, and
       `popupTitle` a template where {prop} is substituted, e.g. "M {mag}".
       Rows whose property is missing are skipped rather than shown blank. */
    if(spec.popup){
      const rows=spec.popup, tpl=spec.popupTitle;
      const fill=(t,p)=>String(t).replace(/\{(\w+)\}/g,(_,k)=>p[k]??"");
      if(map.getLayer(`${base}-pt`)) live.popupPts.push(`${base}-pt`);
      [`${base}-fill`,`${base}-line`,`${base}-pt`].forEach(id=>{
        if(!map.getLayer(id)) return;
        const isPt = id.endsWith("-pt");
        const onClick=e=>{
          /* MapLibre fires one handler per layer, so a click on a scatterer
             also reaches the formation polygon under it. Points take the
             click; the polygon handler stands down. */
          if(!isPt){
            const pts=live.popupPts.filter(L=>map.getLayer(L));
            if(pts.length && map.queryRenderedFeatures(e.point,{layers:pts}).length) return;
          }
          const f=e.features&&e.features[0]; if(!f) return;
          const p=f.properties||{};
          const body=rows.map(r=>{
            const v=p[r[0]];
            return (v===undefined||v===null||v==="")
              ? "" : `<dt>${r[1]}</dt><dd>${v}${r[2]||""}</dd>`;
          }).join("");
          const at=f.geometry&&f.geometry.type==="Point" ? f.geometry.coordinates : e.lngLat;
          new maplibregl.Popup({offset:11,closeButton:true,maxWidth:"250px"})
            .setLngLat(at)
            .setHTML(`<div class="pc">${tpl?`<h4 class="fp">${fill(tpl,p)}</h4>`:""}`
                     +`<dl class="prs">${body}</dl></div>`)
            .addTo(map);
        };
        const enter=()=>{ map.getCanvas().style.cursor="pointer"; };
        const leave=()=>{ map.getCanvas().style.cursor=""; };
        map.on("click",id,onClick); map.on("mouseenter",id,enter); map.on("mouseleave",id,leave);
        live.handlers.push(["click",id,onClick],["mouseenter",id,enter],["mouseleave",id,leave]);
      });
    }
    /* `ref:{coords|auto}` marks the tie point of an InSAR stack — the pixel
       every other measurement is differenced against. It rides on the scatterer
       layer rather than being its own spec, so the automatic search has the
       velocities to hand, and it is added last so the star sits above the cloud.
       Give `coords:[lon,lat]` when you know them; `auto:true` falls back to the
       scatterer closest to zero on both velocity and uncertainty, which is what
       a reference point looks like by construction. */
    if(spec.ref){
      const R=spec.ref;
      let at=R.coords, guessed=false;
      if(!at){
        let best=null;
        (gj.features||[]).forEach(f=>{
          if(!f.geometry || f.geometry.type!=="Point") return;
          const p=f.properties||{};
          const v=Math.abs(Number(p[R.vField||"v"])||0);
          const s=Number(p[R.sField||"s"]);
          const score=(isFinite(s)?s:0)*1e3 + v;
          if(!best || score<best.score) best={score, at:f.geometry.coordinates};
        });
        if(best){ at=best.at; guessed=true; }
      }
      const star = at && starIcon(R.color||"#ffffff", R.stroke||"#16202b");
      if(star){
        const rsid=`${sid}-ref`, rid=`${base}-ref`;
        map.addSource(rsid,{type:"geojson",data:{type:"Feature",properties:{},
          geometry:{type:"Point",coordinates:at}}});
        map.addLayer({id:rid,type:"symbol",source:rsid,
          layout:{"icon-image":star,"icon-size":R.size??1,
            "icon-allow-overlap":true,"icon-ignore-placement":true}});
        live.sources.push(rsid); live.layers.push(rid);

        const label=R.label||"Reference point";
        const onRef=e=>{
          new maplibregl.Popup({offset:11,closeButton:true,maxWidth:"250px"})
            .setLngLat(at)
            .setHTML(`<div class="pc"><h4 class="fp">${label}</h4>`
              +`<dl class="prs"><dt>Position</dt><dd>${at[1].toFixed(5)}° N, `
              +`${at[0].toFixed(5)}° E</dd>`
              +`<dt>Velocity</dt><dd>0 mm/yr by definition</dd></dl></div>`)
            .addTo(map);
        };
        const rEnter=()=>{ map.getCanvas().style.cursor="pointer"; };
        const rLeave=()=>{ map.getCanvas().style.cursor=""; };
        map.on("click",rid,onRef); map.on("mouseenter",rid,rEnter); map.on("mouseleave",rid,rLeave);
        live.handlers.push(["click",rid,onRef],["mouseenter",rid,rEnter],["mouseleave",rid,rLeave]);
        live.popupPts.push(rid);          // the star outranks the units beneath it
        if(guessed) console.info("[geo-cv] reference point inferred at",at,
          "— set ref:{coords:[lon,lat]} to pin it exactly");
      }
    }

    return spec.fit===false ? null : bboxOf(gj);
  }

  if(spec.type==="cog"){
    await ensureCOG();
    const url=`cog://${spec.url}`+(spec.colorRamp?`#color:${spec.colorRamp}`:"");
    map.addSource(sid,{type:"raster",url,tileSize:256});   // 256 per plugin guidance
    live.sources.push(sid);
    map.addLayer({id:base,type:"raster",source:sid,paint:{"raster-opacity":op}});
    live.layers.push(base);
    return null;
  }

  if(spec.type==="dem"){
    await ensureCOG();
    map.addSource(sid,{type:"raster-dem",url:`cog://${spec.url}#dem`,tileSize:256});
    live.sources.push(sid);
    if(spec.terrain){
      map.setTerrain({source:sid,exaggeration:spec.exaggeration||1.2});
      live.terrain=true;
    }
    /* hillshade is a tri-state:
         true      shade, with or without terrain
         false     never shade — use this when a draped image already carries
                   the relief, otherwise the shading is drawn over the top of it
         omitted   shade only when there is no terrain (the original default)

       Strength comes from `shade`. With terrain off, `exaggeration` still means
       the shading strength, as it always did. Draw order follows the order of
       the `layers` array, so put the dem spec BEFORE an image spec to shade
       underneath it, or after to shade over it. */
    const doShade = spec.hillshade ?? !spec.terrain;
    if(doShade){
      const strength = spec.shade ?? (spec.terrain ? .6 : (spec.exaggeration ?? .55));
      map.addLayer({id:base,type:"hillshade",source:sid,
        paint:Object.assign({
          "hillshade-exaggeration":strength,
          "hillshade-shadow-color":spec.shadow||"#050a12",
          "hillshade-highlight-color":spec.highlight||"#e8b15e",
          "hillshade-accent-color":spec.accent||"#1b2634",
          "hillshade-illumination-direction":spec.sun??335
        }, (spec.paint||{}).hillshade||{})});
      live.layers.push(base);
    }
    return null;
  }

  if(spec.type==="wms"){
    // WMS 1.1.1 keeps bbox as minx,miny,maxx,maxy — no 1.3.0 axis-order surprises
    const q=new URLSearchParams({service:"WMS",version:"1.1.1",request:"GetMap",
      layers:spec.layers,styles:spec.styles||"",format:spec.format||"image/png",
      transparent:"true",srs:"EPSG:3857",width:"256",height:"256"});
    const sep=spec.url.includes("?")?"&":"?";
    map.addSource(sid,{type:"raster",tiles:[`${spec.url}${sep}${q}&bbox={bbox-epsg-3857}`],
      tileSize:256,attribution:spec.attribution||""});
    live.sources.push(sid);
    map.addLayer({id:base,type:"raster",source:sid,paint:{"raster-opacity":op}});
    live.layers.push(base);
    return null;
  }

  if(spec.type==="xyz"){
    map.addSource(sid,{type:"raster",tiles:[spec.url],tileSize:spec.tileSize||256,
      minzoom:spec.minzoom||0,maxzoom:spec.maxzoom||22,attribution:spec.attribution||""});
    live.sources.push(sid);
    map.addLayer({id:base,type:"raster",source:sid,paint:{"raster-opacity":op}});
    live.layers.push(base);
    return null;
  }

  /* ---- tomography: a stack of depth slices with a slider and field switcher ----
     spec:{ type:"tomo", manifest:"Delvino/delvino_manifest.json", base:"Delvino/",
            field:"vp", depth:2, opacity:.85 }
     The manifest is written by build.py and holds the rotated image corners, the
     depth list, and a filename per (field, depth). Changing slice swaps the image
     on the existing source rather than rebuilding the layer. */
  if(spec.type==="tomo"){
    const mres=await fetch(spec.manifest);
    if(!mres.ok) throw new Error(`manifest not found (${mres.status})`);
    const man=await mres.json();
    const root=spec.base||"";
    const fields=Object.keys(man.fields);
    let field=fields.includes(spec.field)?spec.field:fields[0];
    let zi=Math.max(0, man.depths.indexOf(spec.depth));
    // slices are indexed positionally: a float key like 2.0 round-trips
    // through JSON as 2, so string keys would silently miss
    const sliceUrl=()=>root+man.fields[field].slices[zi];

    // an image source reports nothing when the file is missing, so probe first
    const probe=url=>new Promise((res,rej)=>{
      const im=new Image();
      im.onload=()=>res(true);
      im.onerror=()=>rej(new Error(`slice not found: ${url.split("/").pop()}`));
      im.src=url;
    });
    await probe(sliceUrl());
    map.addSource(sid,{type:"image",url:sliceUrl(),coordinates:man.corners});
    live.sources.push(sid);
    map.addLayer({id:base,type:"raster",source:sid,
      paint:{"raster-opacity":op,"raster-resampling":"linear"}});
    live.layers.push(base);

    const legendFor=()=>{
      const f=man.fields[field], r=f.range;
      const pct = field!=="vpvs";
      return {title:`Delvina \u2014 ${f.label}`,
        ramp:["#313695","#4589b4","#abd9e9","#f5f5f0","#fddba0","#f46d43","#a50026"],
        min:pct?`\u2212${r}%`:(1.73-r).toFixed(2),
        max:pct?`+${r}%`:(1.73+r).toFixed(2),
        note:`${man.depths[zi]<0?"":""}z = ${man.depths[zi]} km \u00b7 ${
          pct?"perturbation from the 1-D model":"absolute ratio"}`};
    };

    const box=document.createElement("div");
    box.className="tomo";
    box.innerHTML=`<div class="fields">${fields.map(f=>
        `<button type="button" data-f="${f}" aria-pressed="${f===field}">${man.fields[f].label}</button>`
      ).join("")}</div>
      <div class="depth">
        <input type="range" min="0" max="${man.depths.length-1}" step="1" value="${zi}"
               aria-label="Depth slice">
        <span class="zlab">z = ${man.depths[zi]} km</span>
      </div>
      <p class="hint">drag for depth \u00b7 slices fade where rays did not sample</p>`;
    const rng=box.querySelector("input"), lab=box.querySelector(".zlab");
    const hint=box.querySelector(".hint");
    const HINT="drag for depth \u00b7 slices fade where rays did not sample";
    const refresh=()=>{
      const url=sliceUrl();
      lab.textContent=`z = ${man.depths[zi]} km`;
      setLegend(mergeLegends(legendFor(), spec.symbols||null));
      probe(url).then(()=>{
        const src=map.getSource(sid);
        if(src && src.updateImage) src.updateImage({url});
        hint.textContent=HINT; hint.style.color="";
      }).catch(err=>{
        // the slider would otherwise look broken when a PNG is missing
        hint.textContent=err.message; hint.style.color="#d98a7a";
        console.warn("[geo-cv]",err.message);
      });
    };
    rng.addEventListener("input",()=>{ zi=+rng.value; refresh(); });
    box.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{
      field=b.dataset.f;
      box.querySelectorAll("[data-f]").forEach(o=>o.setAttribute("aria-pressed", String(o===b)));
      refresh();
    }));
    clearTomo();
    mapWrap.appendChild(box);
    tomoBox=box;
    setLegend(mergeLegends(legendFor(), spec.symbols||null));
    tomoLegend=legendFor;          // so loadData does not overwrite it
    return null;
  }

  if(spec.type==="image"){
    map.addSource(sid,{type:"image",url:spec.url,coordinates:spec.coordinates});
    live.sources.push(sid);
    map.addLayer({id:base,type:"raster",source:sid,paint:{"raster-opacity":op}});
    live.layers.push(base);
    return null;
  }

  throw new Error(`unknown layer type "${spec.type}"`);
}

/* p is any object carrying layer/layers (+ optional bounds, legend, probe):
   a project entry or a thesis entry, they go through the same path. */
function loadData(p,key,btn,host){
  if(live.key===key){ clearData(); return; }      // second click switches it off
  clearData();
  live.key=key; live.btn=btn; live.host=host;
  btn.setAttribute("aria-pressed","true");
  host.classList.add("on");
  const st=host.querySelector(".pstatus");
  st.classList.remove("err");
  st.innerHTML=`<span class="dot"></span>loading`;

  const specs=p.layers || (p.layer?[p.layer]:[]);
  whenReady(async ()=>{
    try{
      let auto=null;
      for(let i=0;i<specs.length;i++){
        const bb=await addSpec(specs[i],i,key);
        if(bb&&!auto) auto=bb;
      }
      if(live.key!==key) return;                  // scrolled away mid-load
      st.textContent = p.status || "on the map";
      // the lithology group can only be built once the units are actually read
      const own = live.litho.length
        ? mergeLegends(p.legend, {groups:[{label:"Lithology", items:live.litho}]})
        : p.legend;
      setLegend(mergeLegends(tomoLegend && tomoLegend(), own));
      if(p.scene) showSceneLaunch(p.scene);
      if(p.probe){ probeSpec=p.probe; hudProbe.hidden=false; hudProbe.textContent=`${p.probe.label||"value"} —`; }
      if(p.camera){
        // explicit camera: needed for terrain, where a flat fitBounds hides the relief
        const c=p.camera, box=p.bounds||auto;
        const centre=c.center || (box
          ? [(box[0][0]+box[1][0])/2, (box[0][1]+box[1][1])/2]
          : map.getCenter());
        const mv=projectMotion(c, FLIGHT.camera);
        const target={center:centre, zoom:c.zoom??15,
                      pitch:c.pitch??60, bearing:c.bearing??0};
        map[mv.fly?"flyTo":"easeTo"](still(Object.assign(target, mv.opts)));
      }else{
        const box=p.bounds||auto;
        if(box){
          const pad={top:70,bottom:70,left:60,right:60}, mz=p.maxZoom||16;
          const mv=projectMotion(p, FLIGHT.frame);
          // fitBounds has no speed option, so derive the camera the bounds
          // imply and fly to it instead
          const cam = mv.fly ? map.cameraForBounds(box,{padding:pad,maxZoom:mz}) : null;
          if(cam) map.flyTo(still(Object.assign({}, cam, mv.opts)));
          else    map.fitBounds(box, still(Object.assign({padding:pad,maxZoom:mz},
                    mv.fly?{duration:FLIGHT.frame}:mv.opts)));
        }
      }
    }catch(err){
      if(live.key!==key) return;
      st.textContent=`could not load — ${err.message}`;
      st.classList.add("err");
      console.error("[geo-cv]",err);
    }
  });
}

/* ---- 3D scene overlay ----------------------------------------------------
   A project gains a scene by adding:
     scene:{ url:"Syros/Vari.html", title:"Vari, Syros", label:"Open the 3D model" }
   The launch button appears over the map once the project's data is on it;
   the iframe mounts only when that button is pressed. Both are torn down by
   clearData(), so changing chapter removes them like any other layer. */
const mapWrap=document.querySelector(".mapwrap");
let tomoLegend=null;
let sceneBtn=null, sceneFrame=null;

let tomoBox=null;
function clearTomo(){ if(tomoBox){ tomoBox.remove(); tomoBox=null; } }
function closeScene(){ if(sceneFrame){ sceneFrame.remove(); sceneFrame=null; } }
function clearScene(){ closeScene(); clearTomo(); if(sceneBtn){ sceneBtn.remove(); sceneBtn=null; } }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeScene(); });

function showSceneLaunch(sc){
  const b=document.createElement("button");
  b.type="button"; b.className="scene-launch";
  b.innerHTML=`<span class="cube">◱</span><span>${sc.label||"Open the 3D model"}</span>`;
  b.addEventListener("click",()=>openScene(sc));
  mapWrap.appendChild(b);
  sceneBtn=b;
}

function openScene(sc){
  closeScene();
  const wrap=document.createElement("div");
  wrap.className="scene-frame";
  wrap.innerHTML=`<div class="scene-bar">
      <span class="st">3D scene</span><span>${sc.title||""}</span>
      <span class="sp">
        <a href="${sc.url}" target="_blank" rel="noopener">new tab &#8599;</a>
        <button type="button" data-close aria-label="Close the 3D scene">&times; close</button>
      </span>
    </div>
    <iframe src="${sc.url}" title="${sc.title||"3D scene"}"
      allow="fullscreen" loading="lazy"></iframe>`;
  wrap.querySelector("[data-close]").addEventListener("click",closeScene);
  mapWrap.appendChild(wrap);
  sceneFrame=wrap;
  wrap.querySelector("[data-close]").focus();
}

/* ---- legend ---- */
/* Items are [colour, text, shape?] where shape is "box" (default), "dot" or
   "tri", so the swatch matches what is actually drawn on the map. A group may
   carry `items`, its own `ramp`, or both. */
function setLegend(cfg){
  if(!cfg){ legendBox.hidden=true; legendBox.innerHTML=""; return; }
  const bar = c => `<div class="bar" style="background:linear-gradient(90deg,${c.ramp.join(",")})"></div>
      <div class="ends"><span>${c.min??""}</span><span>${c.max??""}</span></div>`;
  const swatches = list => (list||[]).map(it =>
    `<div class="sw"><i class="s-${it[2]||"box"}" style="background:${it[0]}"></i>`
    + `<span>${it[1]}</span></div>`).join("");
  let h=cfg.title?`<h5>${cfg.title}</h5>`:"";
  if(cfg.ramp) h+=bar(cfg);
  // groupLabel gives top-level items a heading, so a legend reads the same
  // whether or not a tomography layer merged something above it
  if(cfg.items) h += cfg.groupLabel
    ? `<div class="lgroup"><p class="glab">${cfg.groupLabel}</p>${swatches(cfg.items)}</div>`
    : swatches(cfg.items);
  if(cfg.groups) h+=cfg.groups.map(g =>
    `<div class="lgroup">${g.label?`<p class="glab">${g.label}</p>`:""}`
    + `${g.ramp?bar(g):""}${swatches(g.items)}</div>`).join("");
  if(cfg.note) h+=`<div class="lnote">${cfg.note}</div>`;
  legendBox.innerHTML=h; legendBox.hidden=false;
}

/* A tomography layer owns the ramp at the top of the legend; the project's own
   entries are folded in underneath rather than thrown away. */
function mergeLegends(a, b){
  if(!a) return b || null;
  if(!b) return a;
  const groups = [...(a.groups||[]), ...(b.groups||[])];
  if(b.items) groups.unshift({label:b.groupLabel||"Symbols", items:b.items});
  return Object.assign({}, a, {groups, note:a.note||b.note});
}

/* ---- optional raster value readout on hover ---- */
map.on("mousemove",({lngLat})=>{
  if(!probeSpec||!window.MaplibreCOGProtocol) return;
  const now=performance.now();
  if(now-probeAt<120) return;                     // throttle: this reads pixels
  probeAt=now;
  MaplibreCOGProtocol.locationValues(probeSpec.url,
    {latitude:lngLat.lat,longitude:lngLat.lng}, map.getZoom())
    .then(v=>{
      if(!probeSpec) return;
      const n=v&&v[0];
      hudProbe.textContent=`${probeSpec.label||"value"} ${
        (n==null||Number.isNaN(n)) ? "—" : n.toFixed(probeSpec.digits??2)}${probeSpec.unit||""}`;
    })
    .catch(()=>{});
});

/* ---------- build narrative + markers ---------- */
const narrative = document.getElementById("narrative");
const pins = {};      // chapter index -> .pin-hit element
const popups = {};    // chapter index -> maplibregl.Popup

/* One logo builder for every place a logo appears, so the chapter and the popup
   can never drift apart. `logo` is either a URL string or
   {src, alt?, h?, white?, link?}. opts.h overrides the configured height (the
   popup wants a smaller mark) and opts.cls adds a class. */
function logoHTML(logo, fallbackAlt, opts){
  if(!logo) return "";
  const g = typeof logo==="string" ? {src:logo} : logo;
  if(!g.src) return "";
  const o = opts||{};
  const h = o.h!==undefined ? o.h : g.h;
  const alt = g.alt || fallbackAlt || "";
  const img = `<img class="logo${g.white?" white":""}${o.cls?" "+o.cls:""}"`
    + ` src="${g.src}" alt="${alt}"`
    + (h?` style="--logo-h:${h}px"`:"")
    + ` loading="lazy" decoding="async">`;
  // when linked, the <a> carries the label and the <img> alt goes empty so
  // screen readers announce the destination once rather than twice
  // A link with no scheme is a RELATIVE path: "www.getmap.eu" would resolve
  // against the page URL and 404. Normalise instead of failing silently.
  const href = g.link && !/^(?:[a-z][a-z0-9+.-]*:|\/\/|\/|#)/i.test(g.link)
    ? "https://"+g.link : g.link;
  return g.link
    ? `<a class="logolink" href="${href}" target="_blank" rel="noopener"`
      + ` aria-label="${alt||"Website"}">`
      + img.replace(`alt="${alt}"`,'alt=""') + `</a>`
    : img;
}

function popupHTML(s){
  return `<div class="pc">
    ${logoHTML(s.logo, s.name, {h:19})}
    <p class="pc-eyebrow">${s.tag||""}</p>
    <h4>${s.title}</h4>
    ${s.pop?`<p>${s.pop}</p>`:""}
    ${s.meta?`<p class="pc-meta">${s.meta.replace(/<\/?b>/g,"")}</p>`:""}
  </div>`;
}

const GLYPH=`<svg class="glyph" viewBox="0 0 14 14" aria-hidden="true">`
  +`<path class="top" d="M7 1.4 12.6 4.3 7 7.2 1.4 4.3Z"/>`
  +`<path d="M1.4 7 7 9.9 12.6 7"/><path d="M1.4 9.7 7 12.6 12.6 9.7"/></svg>`;

/* Builds the contents of the expandable panel: an optional thesis block,
   an optional project list, and an optional set of label/value rows.
   Returns "" when a chapter has nothing extra, so no button is rendered.
   A project carrying `layer` or `layers` becomes a clickable data toggle. */
function detailHTML(s,i){
  let out="";
  if(s.thesis){
    const t=s.thesis, hasData=!!(t.layer||t.layers||t.scene);
    const head = hasData
      ? `<button class="play" type="button" aria-pressed="false" data-t="1"
           title="Show this data on the map">${GLYPH}<span class="ptxt">${t.title}</span></button>`
      : t.link
        ? `<a href="${t.link}" target="_blank" rel="noopener">${t.title}</a>`
        : t.title;
    out+=`<div class="dblock">
      <p class="dlabel">Thesis</p>
      <p class="dtitle">${head}</p>
      ${t.body?`<p class="dbody">${t.body}</p>`:""}
      ${hasData&&t.link?`<p class="plink"><a href="${t.link}" target="_blank" rel="noopener">read it ↗</a></p>`:""}
      ${hasData?`<p class="pstatus" role="status" aria-live="polite"></p>`:""}
    </div>`;
  }
  if(s.projects){
    out+=`<div class="dblock">
      <p class="dlabel">${s.projectsLabel||"Selected work"}</p>
      <ul class="plist">${s.projects.map((p,n)=>{
        const hasData=!!(p.layer||p.layers||p.scene);
        const when=p.when?`<span class="pwhen">${p.when}</span>`:"";
        const head = hasData
          ? `<button class="play" type="button" aria-pressed="false" data-p="${n}"
               title="Show this data on the map">${GLYPH}<span class="ptxt">${p.name}</span>${when}</button>`
          : p.link
            ? `<a href="${p.link}" target="_blank" rel="noopener">${p.name}</a>${when}`
            : `${p.name}${when}`;
        return `<li class="${hasData?"live":""}">
          <p class="pname">${head}</p>
          ${p.body?`<p class="pbody">${p.body}</p>`:""}
          ${hasData&&p.link?`<p class="plink"><a href="${p.link}" target="_blank" rel="noopener">source ↗</a></p>`:""}
          ${hasData?`<p class="pstatus" role="status" aria-live="polite"></p>`:""}
        </li>`;
      }).join("")}</ul>
    </div>`;
  }
  if(s.details){
    out+=`<div class="dblock">
      <dl class="drows">${s.details.map(d=>`<dt>${d[0]}</dt><dd>${d[1]}</dd>`).join("")}</dl>
    </div>`;
  }
  return out;
}

/* A logo that fails to load removes itself, along with its link wrapper if it
   has one, rather than leaving alt text sitting in the layout. `error` does not
   bubble, so this listens in the capture phase — which also catches logos
   inside map popups, whose markup is only built when the popup first opens.
   The organisation name is still in the heading and the meta line, and the
   aria-label on the link is announced before removal. */
document.addEventListener("error", e=>{
  const im=e.target;
  if(!(im instanceof HTMLImageElement) || !im.classList.contains("logo")) return;
  console.warn("[geo-cv] logo failed to load:", im.src);
  (im.closest(".logolink") || im).remove();
}, true);

STORY.forEach((s,i)=>{
  if(s.type==="intro"){
    const el=document.createElement("section");
    el.className="intro"; el.dataset.idx=i;
    el.innerHTML=`<p class="kicker">${s.label}</p><h1>${s.h1}</h1>
      <p class="role">${s.role}</p><p class="scrollcue">Scroll to explore</p>`;
    narrative.appendChild(el); return;
  }
  const el=document.createElement("section");
  el.className="chapter"; el.dataset.idx=i;
  let html=`<p class="tag"><span class="num">${String(i).padStart(2,"0")}</span> ${s.tag}</p>`
    + `<h2>${s.title}</h2>`;
  if(s.body)    html+=`<p>${s.body}</p>`;
  if(s.stack)   html+=`<div class="stack">${s.stack.map(t=>`<span>${t}</span>`).join("")}</div>`;
  if(s.contact) html+=`<div class="contact">${s.contact.map(c=>`<span>${c[0]} ▸</span> ${c[1]}`).join("")}</div>`;
  // logo shares the meta line; either may be absent
  const logoMark = logoHTML(s.logo, s.name);
  if(logoMark || s.meta){
    html+=`<div class="metarow">${logoMark}`
      + (s.meta?`<p class="meta">${s.meta}</p>`:"") + `</div>`;
  }
  if(s.note)    html+=`<span class="edit">${s.note}</span>`;

  const extra=detailHTML(s,i);
  const openLabel=s.moreLabel||"Read more";
  if(extra){
    // per-chapter `open` wins; otherwise fall back to the PANELS_OPEN setting
    const startOpen = !!(s.open!==undefined ? s.open
      : PANELS_OPEN==="desktop"
        ? window.matchMedia("(min-width:900px)").matches
        : PANELS_OPEN);
    html+=`<div class="more">
      <button class="more-btn" type="button" aria-expanded="${startOpen}" aria-controls="more-${i}">
        <span class="chev">▶</span><span class="lbl">${startOpen?"Close":openLabel}</span>
      </button>
      <div class="more-panel${startOpen?" open":""}" id="more-${i}">
        <div class="more-inner">${extra}</div></div>
    </div>`;
  }

  el.innerHTML=html;
  narrative.appendChild(el);


  const btn=el.querySelector(".more-btn");
  if(btn){
    const panel=el.querySelector(".more-panel");
    const lbl=btn.querySelector(".lbl");
    btn.addEventListener("click",()=>{
      const open=btn.getAttribute("aria-expanded")==="true";
      btn.setAttribute("aria-expanded",String(!open));
      panel.classList.toggle("open",!open);
      lbl.textContent=open?openLabel:"Close";
      // collapsing the panel takes its data off the map too
      if(open && live.btn && el.contains(live.btn)) clearData();
    });
  }

  // project toggles: click loads the data, click again removes it
  el.querySelectorAll(".play[data-p]").forEach(pb=>{
    const p=s.projects[+pb.dataset.p];
    const li=pb.closest("li");
    pb.addEventListener("click",()=>loadData(p,`${i}-p${pb.dataset.p}`,pb,li));
  });

  // thesis toggle: same mechanism, hosted by its .dblock
  const tb=el.querySelector(".play[data-t]");
  if(tb) tb.addEventListener("click",()=>loadData(s.thesis,`${i}-t`,tb,tb.closest(".dblock")));

  if(s.marker){
    const hit=document.createElement("div");
    hit.className="pin-hit";
    hit.innerHTML=`<div class="pin"><span class="ring"></span><i></i></div>`;
    const popup=new maplibregl.Popup({offset:18, closeButton:true, maxWidth:"280px"}).setHTML(popupHTML(s));
    new maplibregl.Marker({element:hit, anchor:"center"})
      .setLngLat(LL(s.coords)).setPopup(popup).addTo(map);
    pins[i]=hit; popups[i]=popup;
  }
});

const foot=document.createElement("footer");
foot.innerHTML="Built with MapLibre GL JS + open data · self-hostable static file · replaces the deprecated ArcGIS MapJournal";
narrative.appendChild(foot);

/* ---------- scroll → camera ---------- */
const hudName=document.getElementById("hud-name");
const hudCoords=document.getElementById("hud-coords");
const rail=document.getElementById("rail");
let current=-1;

/* Pins belonging to other chapters: "dim" greys them out and makes them
   unclickable, "solo" removes them entirely, "all" keeps every pin gold all
   the time. Change PIN_MODE near the top of this script. */
function setPins(idx){
  Object.entries(pins).forEach(([k,hit])=>{
    const on=+k===idx;
    hit.classList.toggle("on",on);
    hit.classList.toggle("dim",!on&&PIN_MODE==="dim");
    hit.classList.toggle("hide",!on&&PIN_MODE==="solo");
  });
}

function activate(idx){
  if(idx===current) return;
  current=idx;
  const s=STORY[idx];
  clearData();                     // leaving a chapter takes its data off the map
  Object.values(popups).forEach(p=>{ if(p.isOpen()) p.remove(); });
  setPins(idx);
  map.flyTo(still(Object.assign(flightOpts(s), {center:LL(s.coords), zoom:s.zoom})));
  hudName.textContent=s.name||"";
  hudCoords.innerHTML=`${s.coords[0].toFixed(4)}° N&nbsp;&nbsp;${s.coords[1].toFixed(4)}° E`;
}

const io=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add("seen");
      if(e.target.classList.contains("intro")) e.target.classList.add("go");
      activate(+e.target.dataset.idx);
    }
  });
},{rootMargin:"-45% 0px -45% 0px", threshold:0});
document.querySelectorAll("[data-idx]").forEach(s=>io.observe(s));

addEventListener("scroll",()=>{
  const h=document.documentElement;
  rail.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+"%";
},{passive:true});
addEventListener("resize",()=>map.resize());

document.querySelector(".intro").classList.add("go","seen");
setPins(0);   // paint the initial pin state before the observer fires

/* =========================================================================
   LAYER TEMPLATES — paste one of these into a project as `layer:` or `layers:`

   -- Single-band GeoTIFF with a colour ramp (NDVI, LST, dNBR) --------------
   The COG must be EPSG:3857; the plugin does not reproject. From EPSG:2100:

     gdalwarp in_2100.tif out_cog.tif -t_srs EPSG:3857 -of COG \
       -co BLOCKSIZE=256 -co TILING_SCHEME=GoogleMapsCompatible \
       -co COMPRESS=DEFLATE -co OVERVIEWS=IGNORE_EXISTING -dstnodata NaN

     layer:{ type:"cog",
             url:"https://theogat.com/data/ndvi_chalandri.tif",
             colorRamp:"BrewerRdYlGn9,-0.2,0.8,c",   // scheme,min,max — c = continuous, - = reversed
             opacity:.85 },
     bounds:[[23.78,38.00],[23.83,38.05]],
     legend:{ title:"NDVI", ramp:["#d73027","#fee08b","#1a9850"], min:"-0.2", max:"0.8" },
     probe:{ url:"https://theogat.com/data/ndvi_chalandri.tif", label:"NDVI", digits:2 }

   `probe` reads the pixel under the cursor and prints it in the HUD. It needs
   the same URL, without the cog:// prefix.

   -- GeoServer WMS (easiest route for anything already published) ----------
   GeoServer reprojects EPSG:2100 to 3857 for you, and your SLD styling comes
   along, so this needs no data preparation at all.

     layer:{ type:"wms",
             url:"https://gis.example.gr/geoserver/ws/wms",
             layers:"ws:lst_summer_2025",
             styles:"lst_ramp",          // optional named SLD
             opacity:.8 }

   -- Vectors straight from WFS (ask for 4326, not 2100) --------------------
     layer:{ type:"geojson",
             data:"https://gis.example.gr/geoserver/ws/wfs?service=WFS&version=2.0.0"
                 +"&request=GetFeature&typeName=ws:poi&outputFormat=application/json"
                 +"&srsName=EPSG:4326",
             color:"#5fd0d8",
             paint:{ line:{"line-width":2.4}, circle:{"circle-radius":6} } }

   -- Pre-rendered tile pyramid (gdal2tiles / QGIS XYZ export) -------------
     layer:{ type:"xyz", url:"https://theogat.com/tiles/burn/{z}/{x}/{y}.png",
             minzoom:9, maxzoom:15, opacity:.9 }

   -- Static image pinned to four corners (quick, no tiling) ----------------
   Corners are clockwise from top-left, in [lng,lat].

     layer:{ type:"image", url:"./data/lst_clip.png",
             coordinates:[[23.78,38.05],[23.83,38.05],[23.83,38.00],[23.78,38.00]] }

   -- Hillshade and/or 3D terrain from a single-band COG --------------------
     layer:{ type:"dem", url:"https://theogat.com/data/dem_cog.tif", shade:.6 }
     layer:{ type:"dem", url:"...", terrain:true, exaggeration:1.3 }
     layer:{ type:"dem", url:"...", terrain:true, hillshade:true, shade:.5 }
     layer:{ type:"dem", url:"...", hillshade:false }        // source only
     // colours default to the page palette; override any of them:
     layer:{ type:"dem", url:"...", hillshade:true, shade:.7,
             highlight:"#e8b15e", shadow:"#050a12", accent:"#1b2634", sun:315 }

   -- Several layers on one click -------------------------------------------
     layers:[
       { type:"wms", url:"...", layers:"ws:lst" },
       { type:"geojson", data:"./data/boundary.geojson", color:"#e8b15e", fit:false }
     ]
   ========================================================================= */

</script>
</body>
</html>
